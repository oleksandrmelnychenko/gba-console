<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales and reports performance fixture</title><link rel="icon" href="data:,"></head>
<body>
  <div id="root"></div>
  <script type="module">
    import '@mantine/core/styles.css'
    import '/src/features/sales-ukraine/components/new-sale-wizard/wizard-cart-sheet.css'
    import { createElement as h, Profiler, useState } from 'react'
    import { createRoot } from 'react-dom/client'
    import { MantineProvider } from '@mantine/core'
    import { MemoryRouter, Routes, Route } from 'react-router-dom'
    import { AuthContext } from '/src/features/auth/AuthContext.ts'
    import { I18nProvider } from '/src/shared/i18n/I18nProvider.tsx'
    import { WizardCartCards } from '/src/features/sales-ukraine/components/new-sale-wizard/WizardCartCards.tsx'
    import { ReportInlinePreview } from '/src/features/reports/pages/ReportInlinePreview.tsx'
    import { SalesUkrainePage } from '/src/features/sales-ukraine/pages/SalesUkrainePage.tsx'
    import { RecommendationsPanel } from '/src/features/clients/components/recommendations/RecommendationsPanel.tsx'
    import { WizardCrossSellModal } from '/src/features/sales-ukraine/components/new-sale-wizard/WizardCrossSellModal.tsx'
    import { NewSaleReviewStep } from '/src/features/sales-ukraine/components/new-sale-wizard/NewSaleReviewStep.tsx'
    import { NEW_SALE_REVIEW_INITIAL } from '/src/features/sales-ukraine/components/new-sale-wizard/newSaleWizardState.ts'
    import { NewSaleProductsStep } from '/src/features/sales-ukraine/components/new-sale-wizard/NewSaleProductsStep.tsx'
    import { dispatchWizardKey, initializeWizardKeyboard } from '/src/features/sales-ukraine/components/new-sale-wizard/wizardKeyboard.ts'
    import { ProductDetailPage } from '/src/features/products/pages/ProductDetailPage.tsx'
    const items = Array.from({length:100}, (_,i) => ({NetUid:`item-${i}`,Qty:1,TotalAmount:10,TotalAmountLocal:420,TotalAmountEurToUah:420,
      Product:{NetUid:`product-${i}`,VendorCode:`CODE-${i}`,Name:`Товар ${i}`,CurrentPrice:10}}))
    const rows = Array.from({length:50}, (_,i) => ({Ordinal:i,SourceIndex:i,Values:[{Caption:`Товар ${i}`}]}))
    const columns = Array.from({length:60}, (_,i) => ({Ordinal:i,SourceIndex:i,Values:[{Caption:`Показник ${i}`}]}))
    const preview = {Version:1,ResultSha256:'a'.repeat(64),PresentationOnly:true,Request:null,
      Page:{Offset:0,Limit:50,TotalVisibleRows:50,ReturnedRows:50,HasMore:false},RowSchema:[{Caption:'Товар'}],ColumnSchema:[],
      Rows:rows,Columns:columns,Cells:rows.flatMap(row=>columns.map(col=>({RowSourceIndex:row.SourceIndex,ColumnSourceIndex:col.SourceIndex,Value:{Kind:'decimal',Value:'42.50',Provenance:'producerCell'}})))}
    window.performanceFixture = { samples: [], selected: null }
    const sales = Array.from({length:100}, (_,i) => ({Id:i+1,NetUid:`sale-${i}`,TotalAmount:100+i,TotalAmountLocal:4200+i,
      Created:'2026-10-01T10:00:00Z',SaleNumber:{Value:`SALE-${i}`},BaseLifeCycleStatus:{Name:'New',SaleLifeCycleType:0},
      ClientAgreement:{Client:{FullName:`Клієнт ${i}`,RegionCode:{Value:`k${i}`}},Agreement:{Name:`Договір ${i}`,Currency:{Code:'EUR'}}},
      Order:{OrderItems:items.slice(0,2)}}))
    window.performanceFixture.requests = []
    window.performanceFixture.finishReserves = () => {}
    window.performanceFixture.finishWizardReserves = () => {}
    window.performanceFixture.finishSupply = () => {}
    const relatedProduct = (id, name, qty) => ({NetUid:id,VendorCode:id,NameUA:name,AvailableQtyUk:qty,CurrentPrice:15,CurrentPriceEurToUah:600,ProductAvailabilities:[{Amount:qty}]})
    const wizardProduct = {HasAnalogue:true,HasComponent:true,ComponentProducts:[{ComponentProduct:relatedProduct('COMP-1','Комплектуюча 1',3),SetComponentsQty:2},{ComponentProduct:relatedProduct('COMP-2','Комплектуюча 2',2),SetComponentsQty:1}],NetUid:'wizard-product',VendorCode:'TEST-001',NameUA:'Товар майстра',AvailableQtyUk:4,CurrentPrice:10}
    const recommended = Array.from({length:30}, (_,index)=>({Product:{Id:index+1,NetUid:`reco-${index}`,VendorCode:`REC-${index}`,Name:`Рекомендація ${index}`,AvailableQtyUk:5,CurrentPrice:12,CurrentPriceEurToUah:480},ClientAgreementNetId:'agreement-1',Rank:index+1,Score:0.8,Source:'discovery',SourceDetail:'copurchase',SourceHistoryStart:'2024-01-01',EffectiveStart:'2024-01-01',HistoryComplete:true}))
    const agreement = {NetUid:'agreement-1',Agreement:{IsActive:true,PricingId:1,Name:'Тестовий договір'}}
    window.performanceFixture.finishCrossSell = () => {}
    window.performanceFixture.finishRecommendationSeed = () => {}
    const response = data => new Response(JSON.stringify(data), {headers:{'Content-Type':'application/json'}})
    // Standalone read-only fixture: no request is forwarded to a real API.
    window.fetch = (input,options={}) => {
      const url = new URL(typeof input==='string'?input:input.url,location.href)
      window.performanceFixture.requests.push(url.pathname+url.search)
      if (['/transporters/types/sales-ukraine/edit','/deliveries/recipients/all/client'].some(path=>url.pathname.endsWith(path))) return Promise.resolve(response([]))
      if (url.pathname.endsWith('/clients/get/identity-attention')) return Promise.resolve(response(null))
      if (url.pathname.endsWith('/clients/sales-ukraine/create/details')) return Promise.resolve(response({NetUid:'client-1',FullName:'Тестовий клієнт'}))
      if (url.pathname.endsWith('/agreements/client/all')) return Promise.resolve(response([agreement]))
      if (['/clients/get/debt/grouped','/sales/all/register'].some(path => url.pathname.endsWith(path))) return Promise.resolve(response([]))
      if (url.pathname.endsWith('/recommendations/get')) return Promise.resolve(response(recommended))
      if (url.pathname.endsWith('/recommendations/get/product')) {
        if (url.searchParams.get('productNetId')==='panel-seed') return Promise.resolve(response(recommended))
        return new Promise((resolve,reject)=>{
          window.performanceFixture.finishCrossSell=()=>resolve(response(recommended))
          options.signal?.addEventListener('abort',()=>reject(new DOMException('Aborted','AbortError')),{once:true})
        })
      }
      if (url.pathname.endsWith('/products/clients/details')) return new Promise((resolve,reject)=>{
        window.performanceFixture.finishRecommendationSeed=()=>resolve(response({NetUid:'panel-seed',VendorCode:'PANEL-SEED',Name:'Основний товар рекомендацій'}))
        options.signal?.addEventListener('abort',()=>reject(new DOMException('Aborted','AbortError')),{once:true})
      })
      if (url.pathname.endsWith('/products/get/analogues')) return Promise.resolve(response([relatedProduct('ANA-1','Аналог 1',5),relatedProduct('ANA-2','Аналог 2',4)]))
      if (url.pathname.endsWith('/products/search/advanced')) return Promise.resolve(response([wizardProduct]))
      if (url.pathname.endsWith('/products/pricings/current')) return Promise.resolve(response(123.45))
      if (url.pathname.endsWith('/products/pricings/all')) return Promise.resolve(response([{PriceEUR:123.45,DiscountRate:0}]))
      if (url.pathname.endsWith('/products/reservations/current/carousel/agreement')) return new Promise((resolve,reject) => {
        window.performanceFixture.finishWizardReserves = () => resolve(response([]))
        options.signal?.addEventListener('abort',()=>reject(new DOMException('Aborted','AbortError')),{once:true})
      })
      if (url.pathname.endsWith('/products/availabilities/all')) return Promise.resolve(response({TotalAvailabilities:{StorageUkrNotVat:7},InStorageUkrNotVat:[{NetId:'stock-1',Name:'Тестовий склад',Amount:7}]}))
      if (url.pathname.endsWith('/supplies/orders/sales-ukraine/future-reservations/nearest')) return new Promise((resolve,reject) => {
        window.performanceFixture.finishSupply = () => resolve(response({Number:'SUPPLY-READY',Qty:3}))
        options.signal?.addEventListener('abort',()=>reject(new DOMException('Aborted','AbortError')),{once:true})
      })
      if (url.pathname.endsWith('/pricing/recommend')) return Promise.resolve(response({confidence:'low',recommended_price:null}))
      if (url.pathname.endsWith('/sales/ukraine/registry')) return Promise.resolve(response(sales))
      if (url.pathname.endsWith('/organizations/all')) return Promise.resolve(response([]))
      if (url.pathname.endsWith('/products/assortment/details')) return Promise.resolve(response({NetUid:'product-1',VendorCode:'FAST-PRODUCT',Name:'Тестовий товар',CurrentPrice:42.75}))
      if (url.pathname.endsWith('/products/reservations/get/info')) return new Promise((resolve,reject) => {
        window.performanceFixture.finishReserves = () => resolve(response({TotalReservedUK:17}))
        options.signal?.addEventListener('abort',()=>reject(new DOMException('Aborted','AbortError')),{once:true})
      })
      return Promise.reject(new Error(`Unexpected fixture request: ${url.pathname}`))
    }
    const auth = {hasPermission:()=>true,isLoading:false,user:{NetUid:'fixture-user',FirstName:'Test',LastName:'User'}}
    const onRender = (id,phase,duration) => window.performanceFixture.samples.push({id,phase,duration})
    const onRowClick = item => { window.performanceFixture.selected = item.NetUid }
    const cartSale = rows => ({NetUid:'fixture-sale',ClientAgreement:{NetUid:'agreement-1',Agreement:{Currency:{Code:'EUR'}}},Order:{OrderItems:rows,OrderSource:1}})
    function DeliveryFixture({cart}) {
      const [value,setValue]=useState(NEW_SALE_REVIEW_INITIAL)
      return h(NewSaleReviewStep,{clientNetId:'client-1',sale:cartSale(cart),value,onChange:patch=>setValue(current=>({...current,...patch}))})
    }
    function CrossSellFixture() {
      const [opened,setOpened]=useState(false)
      return h('section',null,h('button',{onClick:()=>setOpened(true)},'Відкрити крос-продажі'),
        h(WizardCrossSellModal,{opened,onClose:()=>setOpened(false),agreementNetId:'agreement-1',clientNetId:'client-1',excludeNetUids:new Set(),isVatSale:false,localCurrencyCode:'UAH',useEurToUah:true,seedProduct:wizardProduct,onPick:product=>{window.performanceFixture.crossSellPicked=product.NetUid}}))
    }
    function Fixture() {
      const [cart,setCart] = useState(items), [revision,setRevision] = useState(0), [view,setView] = useState('cart')
      return h('main',{style:{padding:16,minWidth:0},onKeyDown:event=>{if(view==='wizard') dispatchWizardKey(event)}},
        h('nav',null,
          h('button',{onClick:()=>setView('cart')},'Кошик'),
          h('button',{onClick:()=>setView('report')},'Звіт'),
          h('button',{onClick:()=>setView('sales')},'Реєстр продажів'),
          h('button',{onClick:()=>setView('product')},'Картка товару'),
          h('button',{onClick:()=>setView('recommendations')},'Рекомендації клієнта'),
          h('button',{onClick:()=>setView('crosssell')},'Крос-продажі'),
          h('button',{onClick:()=>{initializeWizardKeyboard(2);setView('delivery')}},'Доставка'),
          h('button',{onClick:()=>{initializeWizardKeyboard(1);setView('wizard')}},'Майстер продажу'),
          h('button',{onClick:()=>window.performanceFixture.finishWizardReserves()},'Завершити резерви майстра'),
          h('button',{onClick:()=>window.performanceFixture.finishSupply()},'Завершити постачання'),
          h('button',{onClick:()=>window.performanceFixture.finishReserves()},'Завершити резерви'),
          h('button',{onClick:()=>setCart(previous=>previous.map((item,i)=>i===50?{...item,Qty:item.Qty+1,TotalAmount:item.TotalAmount+10,TotalAmountLocal:item.TotalAmountLocal+420,TotalAmountEurToUah:item.TotalAmountEurToUah+420}:item))},'Змінити одну позицію'),
          h('button',{onClick:()=>setRevision(value=>value+1)},'Оновити панель'),
          h('output',null,revision)),
        view==='cart' ? h(Profiler,{id:'cart',onRender},h(WizardCartCards,{items:cart,busy:false,localCurrencyCode:'UAH',useEurToUah:false,onRowClick}))
          : view==='report' ? h(Profiler,{id:'report',onRender},h(ReportInlinePreview,{preview}))
          : h(AuthContext.Provider,{value:auth},h(MemoryRouter,{initialEntries:['/products/product-1']},h(Profiler,{id:view,onRender},
            view==='delivery'?h(DeliveryFixture,{cart}):view==='recommendations'?h(RecommendationsPanel,{client:{NetUid:'client-1'},productNetId:'panel-seed'}):view==='crosssell'?h(CrossSellFixture):view==='sales'?h(SalesUkrainePage):view==='wizard'?h(NewSaleProductsStep,{agreementNetId:'agreement-1',clientNetId:'client-1',client:null,sale:cartSale(cart),onCartChanged:()=>{}}):h(Routes,null,h(Route,{path:'/products/:netId',element:h(ProductDetailPage)}))))))
    }
    createRoot(document.getElementById('root')).render(h(MantineProvider,null,h(I18nProvider,null,h(Fixture))))
  </script>
</body>
</html>
